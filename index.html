<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Simple progressive overload tracker focused on exercise history.">
  <title>Gym Overload</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <style>
    :root{
      --bg:#f5f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;
      --accent:#111827;--accent-2:#374151;--soft:#eef0f3;--danger:#b91c1c;
      --good:#166534;--good-bg:#dcfce7;--radius:18px
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh}
    button,input{font:inherit}
    button{border:0;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    .app{max-width:720px;margin:0 auto;padding:env(safe-area-inset-top) 14px calc(26px + env(safe-area-inset-bottom))}
    header{padding:18px 2px 12px}
    h1{font-size:25px;line-height:1.1;margin:0}
    h2{font-size:19px;line-height:1.2;margin:0}
    h3{font-size:16px;margin:0}
    .muted{color:var(--muted)}
    .hint{font-size:13px;color:var(--muted);margin-top:4px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 3px 12px rgba(17,24,39,.04)}
    .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .stack{display:flex;flex-direction:column;gap:10px}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap}
    .primary{background:var(--accent);color:#fff;border-radius:13px;padding:13px 16px;font-weight:700}
    .secondary{background:var(--soft);color:var(--text);border-radius:13px;padding:12px 14px;font-weight:650}
    .danger{background:#fee2e2;color:var(--danger);border-radius:12px;padding:10px 12px;font-weight:650}
    .small{padding:9px 11px;font-size:14px}
    input{width:100%;padding:12px 13px;border:1px solid #d1d5db;border-radius:12px;background:#fff;color:var(--text);outline:none}
    input:focus{border-color:#6b7280;box-shadow:0 0 0 3px rgba(17,24,39,.08)}
    .search{font-size:16px;padding:13px 14px}
    .section-title{margin-bottom:10px}
    .exercise-list{display:flex;flex-direction:column;gap:8px}
    .exercise-item{width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;justify-content:space-between;gap:12px;align-items:center}
    .exercise-item:active{transform:scale(.995)}
    .exercise-name{font-weight:750}
    .exercise-last{font-size:13px;color:var(--muted);margin-top:4px}
    .chevron{color:#9ca3af;font-size:22px;line-height:1}
    .empty{padding:30px 14px;text-align:center;color:var(--muted)}
    .back{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--text);padding:2px 0 10px;font-weight:700}
    .title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    .metric{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .pill{background:var(--soft);padding:6px 9px;border-radius:999px;font-size:12px;color:var(--muted)}
    .pill.good{background:var(--good-bg);color:var(--good)}
    .history-block{border-top:1px solid var(--line);padding-top:13px;margin-top:13px}
    .history-block:first-child{border-top:0;padding-top:0;margin-top:0}
    .date{font-weight:750}
    .sets-line{font-size:15px;margin-top:7px;line-height:1.5}
    .log-card{background:#fafafa;border:1px solid var(--line);border-radius:15px;padding:13px;margin-top:12px}
    .set-head,.set-row{display:grid;grid-template-columns:38px 1fr 1fr 42px;gap:8px;align-items:center}
    .set-head{font-size:12px;color:var(--muted);padding:0 0 4px}
    .set-number{text-align:center;color:var(--muted);font-size:14px}
    .set-row{margin-top:8px}
    .tiny{background:var(--soft);border-radius:10px;padding:10px}
    .copy-row{display:flex;gap:8px;margin-top:12px}
    .notice{font-size:13px;color:var(--muted);background:var(--soft);padding:10px 12px;border-radius:12px;margin-top:10px}
    .bottom-actions{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 24%)}
    .footer-note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
    .nav-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 14px}
    .nav-button{background:#fff;color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-weight:700}
    .nav-button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .install{display:none}
    @media (min-width:620px){.app{padding-left:24px;padding-right:24px}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="row">
      <div>
        <h1>Gym Overload</h1>
        <div class="hint">Choose an exercise, see your history, log your new sets.</div>
      </div>
      <span class="pill">On device</span>
    </div>
  </header>

  <div class="nav-row">
    <button class="nav-button active" id="navExercises">Exercises</button>
    <button class="nav-button" id="navBackup">Backup</button>
  </div>

  <main id="appRoot"></main>

  <div class="footer-note">Your data is stored on this device. Use Backup regularly.</div>
</div>

<script>
const STORAGE_KEY = 'gym-overload-v2';
const OLD_KEY = 'gym-overload-v1';
let state = loadState();
let screen = 'exercises';
let selectedExerciseId = null;
let searchTerm = '';
let deferredInstallPrompt = null;

function today(){ return new Date().toISOString().slice(0,10); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(date){ return new Date(date+'T00:00:00').toLocaleDateString('en-NZ',{day:'numeric',month:'short',year:'numeric'}); }
function exerciseById(id){ return state.exercises.find(e=>e.id===id); }
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function loadState(){
  try {
    const v2 = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(v2 && Array.isArray(v2.exercises) && Array.isArray(v2.entries)) return v2;
  } catch {}
  try {
    const old = JSON.parse(localStorage.getItem(OLD_KEY));
    if(old && Array.isArray(old.exercises) && Array.isArray(old.sessions)){
      const entries=[];
      old.sessions.forEach(session=>{
        (session.exercises||[]).forEach(ex=>{
          entries.push({id:uid(), date:session.date, exerciseId:ex.exerciseId, sets:(ex.sets||[]).map(s=>({weight:Number(s.weight)||0,reps:Number(s.reps)||0}))});
        });
      });
      const migrated={exercises:old.exercises, entries};
      localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
      return migrated;
    }
  } catch {}
  return {exercises:[],entries:[]};
}

function entriesFor(exerciseId){
  return state.entries.filter(e=>e.exerciseId===exerciseId).sort((a,b)=>b.date.localeCompare(a.date));
}
function latestFor(exerciseId){ return entriesFor(exerciseId)[0] || null; }
function formatSets(sets){ return sets.map(s=>`${s.weight} kg × ${s.reps}`).join(' · '); }
function bestWeight(exerciseId){
  const entries=entriesFor(exerciseId); let best=0;
  entries.forEach(e=>e.sets.forEach(s=>{best=Math.max(best, Number(s.weight)||0);}));
  return best || null;
}
function exerciseCountText(id){
  const count=entriesFor(id).length;
  return count===0?'No history yet':`${count} ${count===1?'entry':'entries'}`;
}
function setActiveNav(name){
  document.getElementById('navExercises').classList.toggle('active',name==='exercises');
  document.getElementById('navBackup').classList.toggle('active',name==='backup');
}
function render(){
  setActiveNav(screen==='backup'?'backup':'exercises');
  const root=document.getElementById('appRoot');
  if(screen==='backup'){ renderBackup(root); return; }
  if(selectedExerciseId){ renderExercise(root); return; }
  renderExercises(root);
}

function renderExercises(root){
  const filtered=state.exercises.filter(e=>e.name.toLowerCase().includes(searchTerm.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
  root.innerHTML=`
    <section class="card">
      <div class="section-title"><h2>Your exercises</h2><div class="hint">Tap an exercise to see its full history and record new sets.</div></div>
      <input id="exerciseSearch" class="search" placeholder="Search exercises" autocomplete="off" value="${esc(searchTerm)}">
    </section>
    <section class="card">
      ${filtered.length ? `<div class="exercise-list">${filtered.map(e=>{
        const last=latestFor(e.id);
        return `<button class="exercise-item" data-id="${e.id}">
          <div><div class="exercise-name">${esc(e.name)}</div><div class="exercise-last">${last?`Last: ${formatSets(last.sets)}`:exerciseCountText(e.id)}</div></div>
          <div class="chevron">›</div>
        </button>`;
      }).join('')}</div>` : `<div class="empty">${state.exercises.length?'No exercises match your search.':'Add your first exercise below.'}</div>`}
    </section>
    <section class="card">
      <h2>Add exercise</h2>
      <div class="stack" style="margin-top:10px">
        <input id="newExercise" placeholder="e.g. Bench Press" autocomplete="off">
        <button class="primary" id="addExercise">Add exercise</button>
      </div>
    </section>`;

  document.getElementById('exerciseSearch')?.addEventListener('input',e=>{searchTerm=e.target.value;renderExercises(document.getElementById('appRoot'));});
  document.querySelectorAll('.exercise-item').forEach(b=>b.addEventListener('click',()=>{selectedExerciseId=b.dataset.id;render();}));
  document.getElementById('addExercise')?.addEventListener('click',addExercise);
  document.getElementById('newExercise')?.addEventListener('keydown',e=>{if(e.key==='Enter')addExercise();});
}

function addExercise(){
  const input=document.getElementById('newExercise'); const name=input?.value.trim(); if(!name)return;
  if(state.exercises.some(e=>e.name.toLowerCase()===name.toLowerCase())){
    alert('That exercise already exists.'); return;
  }
  const id=uid(); state.exercises.push({id,name}); save(); selectedExerciseId=id; render();
}

function renderExercise(root){
  const ex=exerciseById(selectedExerciseId);
  if(!ex){selectedExerciseId=null;render();return;}
  const history=entriesFor(ex.id);
  const latest=history[0]||null;
  const best=bestWeight(ex.id);

  root.innerHTML=`
    <button class="back" id="backToExercises">‹ Exercises</button>
    <section class="card">
      <div class="title-row">
        <div><h2>${esc(ex.name)}</h2><div class="hint">${history.length?`${history.length} saved ${history.length===1?'entry':'entries'}`:'No entries yet'}</div></div>
        <button class="danger small" id="deleteExercise">Delete</button>
      </div>
      <div class="metric">
        ${latest?`<span class="pill">Last: ${esc(formatSets(latest.sets))}</span>`:'<span class="pill">No previous sets</span>'}
        ${best?`<span class="pill good">Best weight: ${best} kg</span>`:''}
      </div>
    </section>

    <section class="card">
      <div class="row"><div><h2>Log new sets</h2><div class="hint">Enter what you did today.</div></div><input id="entryDate" type="date" value="${today()}" style="width:auto;min-width:145px"></div>
      ${latest?`<div class="copy-row"><button class="secondary small" id="copyLast">Copy last sets</button><span class="pill" style="align-self:center">Last: ${esc(formatSets(latest.sets))}</span></div>`:''}
      <div class="log-card">
        <div class="set-head"><div></div><div>Weight (kg)</div><div>Reps</div><div></div></div>
        <div id="setRows"></div>
        <button class="secondary small" id="addSet" style="margin-top:10px">+ Add set</button>
      </div>
      <div class="bottom-actions">
        <button class="primary" id="saveEntry" style="width:100%">Save ${history.length?'new':'first'} entry</button>
      </div>
    </section>

    <section class="card">
      <div class="row"><div><h2>History</h2><div class="hint">Every saved entry for ${esc(ex.name)}.</div></div></div>
      ${history.length?history.map((entry,i)=>`
        <div class="history-block">
          <div class="row"><div class="date">${fmtDate(entry.date)}</div><button class="danger small delete-entry" data-id="${entry.id}">Delete</button></div>
          <div class="sets-line">${esc(formatSets(entry.sets))}</div>
          ${i===0?'<div class="notice">This is your most recent entry.</div>':''}
        </div>`).join(''):`<div class="empty">No history yet. Save your first set above.</div>`}
    </section>`;

  document.getElementById('backToExercises').addEventListener('click',()=>{selectedExerciseId=null;render();});
  document.getElementById('deleteExercise').addEventListener('click',()=>deleteExercise(ex.id));
  document.getElementById('copyLast')?.addEventListener('click',()=>populateSetRows(latest?.sets||[]));
  document.getElementById('addSet').addEventListener('click',()=>addSetRow());
  document.getElementById('saveEntry').addEventListener('click',saveEntry);
  document.querySelectorAll('.delete-entry').forEach(b=>b.addEventListener('click',()=>deleteEntry(b.dataset.id)));
  populateSetRows([{weight:'',reps:''}]);
}

function populateSetRows(sets){
  const root=document.getElementById('setRows'); if(!root)return;
  root.innerHTML=''; sets.forEach(s=>addSetRow(s));
}
function addSetRow(set={weight:'',reps:''}){
  const root=document.getElementById('setRows'); if(!root)return;
  const idx=root.children.length;
  const div=document.createElement('div'); div.className='set-row';
  div.innerHTML=`<div class="set-number">${idx+1}</div><input class="weight" type="number" step="0.5" min="0" inputmode="decimal" placeholder="kg" value="${set.weight ?? ''}"><input class="reps" type="number" step="1" min="0" inputmode="numeric" placeholder="reps" value="${set.reps ?? ''}"><button class="tiny remove-set" type="button">×</button>`;
  div.querySelector('.remove-set').addEventListener('click',()=>{div.remove();renumberRows();});
  root.appendChild(div);
}
function renumberRows(){document.querySelectorAll('#setRows .set-row').forEach((row,i)=>row.querySelector('.set-number').textContent=i+1);}

function saveEntry(){
  const date=document.getElementById('entryDate').value || today();
  const rows=[...document.querySelectorAll('#setRows .set-row')];
  const sets=rows.map(r=>({weight:r.querySelector('.weight').value,reps:r.querySelector('.reps').value})).filter(s=>s.weight!=='' || s.reps!=='');
  if(!sets.length){alert('Add at least one set before saving.');return;}
  const cleanSets=sets.map(s=>({weight:Number(s.weight)||0,reps:Number(s.reps)||0}));
  state.entries.push({id:uid(),date,exerciseId:selectedExerciseId,sets:cleanSets});
  save(); render();
}

function deleteEntry(id){
  if(!confirm('Delete this history entry?'))return;
  state.entries=state.entries.filter(e=>e.id!==id); save(); render();
}
function deleteExercise(id){
  const ex=exerciseById(id); if(!ex)return;
  if(!confirm(`Delete ${ex.name}? Its history will also be deleted.`))return;
  state.exercises=state.exercises.filter(e=>e.id!==id); state.entries=state.entries.filter(e=>e.exerciseId!==id); save(); selectedExerciseId=null; render();
}

function renderBackup(root){
  root.innerHTML=`
    <section class="card">
      <button class="back" id="backFromBackup">‹ Exercises</button>
      <h2>Backup</h2>
      <div class="hint">Save a copy of your exercises and history, or restore a previous backup.</div>
    </section>
    <section class="card">
      <div class="stack">
        <button class="primary" id="exportBtn">Export data</button>
        <button class="secondary" id="importBtn">Import data</button>
        <input id="importFile" type="file" accept="application/json" hidden>
      </div>
      <div class="notice">Your data currently stays on this device. Export a backup before changing phones or clearing browser data.</div>
    </section>`;
  document.getElementById('backFromBackup').addEventListener('click',()=>{screen='exercises';render();});
  document.getElementById('exportBtn').addEventListener('click',exportData);
  document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change',importData);
}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='gym-overload-backup.json'; a.click(); URL.revokeObjectURL(url);
}
async function importData(e){
  const file=e.target.files?.[0]; if(!file)return;
  try{
    const imported=JSON.parse(await file.text());
    if(!Array.isArray(imported.exercises)||!Array.isArray(imported.entries)) throw new Error();
    state={exercises:imported.exercises,entries:imported.entries}; save(); selectedExerciseId=null; screen='exercises'; render(); alert('Backup imported.');
  }catch{alert('That file is not a valid Gym Overload backup.');}
}

document.getElementById('navExercises').addEventListener('click',()=>{screen='exercises';selectedExerciseId=null;render();});
document.getElementById('navBackup').addEventListener('click',()=>{screen='backup';selectedExerciseId=null;render();});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
render();
</script>
</body>
</html>
